<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الانضمام لفريق الأمن السيبراني</title>
    <!-- استدعاء خط أسطوري من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* متغيرات الألوان والتصميم الأساسية */
        :root {
            --bg-main: #060913;
            --card-bg: rgba(15, 23, 42, 0.75);
            --accent-color: #00ff88;
            --accent-glow: rgba(0, 255, 136, 0.25);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(0, 255, 136, 0.4);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --input-bg: rgba(2, 6, 23, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* شبكة خلفية متحركة لإعطاء الطابع السيبراني */
        .background-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* الحاوية الرئيسية Modern Glassmorphism */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 255, 136, 0.05);
        }

        /* الهيدر والعناوين */
        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.2);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .pulse-icon {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 1.5s infinite;
        }

        .form-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .form-header h1 span {
            color: var(--accent-color);
            text-shadow: 0 0 15px var(--accent-glow);
        }

        .form-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* الحقول والمدخلات */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .form-group label svg {
            color: var(--accent-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
            background: rgba(2, 6, 23, 0.9);
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper::after {
            content: "▼";
            font-size: 0.7rem;
            color: var(--text-secondary);
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        textarea {
            resize: vertical;
        }

        /* الزر التفاعلي */
        .cyber-button {
            width: 100%;
            padding: 16px;
            background: var(--accent-color);
            color: #020617;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--accent-glow);
            margin-top: 10px;
        }

        .cyber-button svg {
            transform: rotate(180deg);
            transition: transform 0.3s ease;
        }

        .cyber-button:hover {
            background: #00e67a;
            box-shadow: 0 6px 25px rgba(0, 255, 136, 0.4);
            transform: translateY(-2px);
        }

        .cyber-button:hover svg {
            transform: rotate(180deg) translateX(5px);
        }

        /* الذيل */
        .form-footer {
            text-align: center;
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .form-footer p {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* حركة النبض */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 255, 136, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }
    </style>
</head>
<body>

    <div class="background-grid"></div>

    <main class="container">
        <header class="form-header">
            <div class="badge">
                <span class="pulse-icon"></span>
                <span>باب الانضمام مفتوح</span>
            </div>
            <h1>فريق <span>الأمن السيبراني</span></h1>
            <p>نبحث عن الشغوفين والمحترفين للعمل والتطور معاً في بيئة آمنة وأخلاقية.</p>
        </header>

        <form class="cyber-form">
            
            <div class="form-group">
                <label for="fullname">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    الاسم الكامل
                </label>
                <input type="text" id="fullname" name="fullname" placeholder="أدخل اسمك أو كنيتك" required>
            </div>

            <div class="form-group">
                <label for="contact">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    وسيلة التواصل (تليجرام / واتساب)
                </label>
                <input type="text" id="contact" name="contact" placeholder="@username أو رقم الهاتف" required>
            </div>

            <div class="form-group">
                <label for="experience">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                    المستوى والخبرة الحالية
                </label>
                <div class="select-wrapper">
                    <select id="experience" name="experience" required>
                        <option value="" disabled selected>اختر مستواك الحالي...</option>
                        <option value="مبتدئ (لا توجد خبرة / أرغب في التعلم)">مبتدئ (لا توجد خبرة / أرغب في التعلم)</option>
                        <option value="متوسط (فهم بالأساسيات والأدوات)">متوسط (فهم بالأساسيات والأدوات)</option>
                        <option value="متقدم (خبرة عمل واختبار اختراق)">متقدم (خبرة عمل واختبار اختراق)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="skills">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                    المهارات والأدوات المتقنة
                </label>
                <textarea id="skills" name="skills" rows="3" placeholder="مثال: Python, Linux, Metasploit, أو اتركها فارغة إذا كنت في بداية الطريق"></textarea>
            </div>

            <button type="submit" class="cyber-button">
                <span>إرسال الطلب عبر الواتساب</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>

        </form>

        <footer class="form-footer">
            <p>🔒 جميع البيانات تُعامل بخصوصية تامة ولأغراض التنظيم الداخلي فقط.</p>
        </footer>
    </main>

    <!-- كود ربط البيانات وتحويلها لواتساب -->
    <script>
        document.querySelector('.cyber-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullname = document.getElementById('fullname').value;
            const contact = document.getElementById('contact').value;
            const experience = document.getElementById('experience').value;
            const skills = document.getElementById('skills').value;

            // رقم الواتساب بالصيغة الدولية (كود مصر 20)
            const myPhoneNumber = "201276461885";

            // تنسيق الرسالة التي ستصلك
            const message = `🛡️ *طلب انضمام جديد للفرقة:*\n\n` +
                            `👤 *الاسم:* ${fullname}\n` +
                            `📞 *وسيلة التواصل:* ${contact}\n` +
                            `📊 *المستوى:* ${experience}\n` +
                            `💻 *المهارات/الأدوات:* ${skills || "لا توجد / مبتدئ"}`;

            const encodedMessage = encodeURIComponent(message);
            const whatsappURL = `https://wa.me/${myPhoneNumber}?text=${encodedMessage}`;

            // فتح محادثة الواتساب فوراً بالرسالة الجاهزة
            window.open(whatsappURL, '_blank');
        });
    </script>
</body>
</html>
